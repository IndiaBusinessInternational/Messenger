<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" id="theme-color-meta" />
  <meta name="description" content="IBI Messenger — send messages and images directly to your IBI Google Doc archive." />

  <title>IBI Messenger</title>

  <meta property="og:title" content="IBI Messenger" />
  <meta property="og:type" content="website" />

  <!-- Favicon: 'IBI' text in #00c5ff on black, Roboto, as inline SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%23000000'/><text x='50%25' y='50%25' dy='.06em' text-anchor='middle' dominant-baseline='middle' font-family='Roboto, Arial, sans-serif' font-weight='900' font-size='22' fill='%2300c5ff' letter-spacing='-0.5'>IBI</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%23000000'/><text x='50%25' y='50%25' dy='.06em' text-anchor='middle' dominant-baseline='middle' font-family='Roboto, Arial, sans-serif' font-weight='900' font-size='22' fill='%2300c5ff' letter-spacing='-0.5'>IBI</text></svg>" />

  <!-- Roboto font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       IBI MESSENGER  —  WhatsApp-style chat
       Brand: #00c5ff cyan on #000 black, Roboto 16px
       ========================================================= */
    :root {
      --ibi-cyan: #00c5ff;
      --ibi-cyan-strong: #00aee0;
      --ibi-black: #000000;

      /* Light theme */
      --bg: #e8edf2;
      --chat-bg: #e8edf2;
      --surface: #ffffff;
      --surface-2: #f4f6fa;
      --text: #14181d;
      --text-muted: #5b6671;
      --text-soft: #8a96a3;
      --border: #d6dde5;
      --bubble-sent-bg: #00c5ff;
      --bubble-sent-text: #001a22;
      --bubble-sent-meta: rgba(0, 26, 34, 0.65);
      --input-bar-bg: #f4f6fa;
      --input-bg: #ffffff;
      --header-bg: #000000;
      --header-text: #00c5ff;
      --shadow-bubble: 0 1px 1.5px rgba(0, 0, 0, 0.08);
      --shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.08);
      --success: #10b981;
      --error: #ef4444;
      --bubble-pattern: rgba(0, 0, 0, 0.025);
    }

    [data-theme="dark"] {
      --bg: #0a0d12;
      --chat-bg: #0e131a;
      --surface: #131a23;
      --surface-2: #1a2230;
      --text: #f1f5f9;
      --text-muted: #a3b1c0;
      --text-soft: #6c7a8a;
      --border: #232c38;
      --bubble-sent-bg: #00c5ff;
      --bubble-sent-text: #001a22;
      --bubble-sent-meta: rgba(0, 26, 34, 0.7);
      --input-bar-bg: #131a23;
      --input-bg: #1a2230;
      --header-bg: #000000;
      --header-text: #00c5ff;
      --shadow-bubble: 0 1px 1.5px rgba(0, 0, 0, 0.4);
      --shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.4);
      --bubble-pattern: rgba(255, 255, 255, 0.03);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      font-family: 'Roboto', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* App shell — full viewport, 3 stacked rows */
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      height: 100vh;
      max-width: 720px;
      margin: 0 auto;
      background: var(--chat-bg);
      box-shadow: var(--shadow-elevated);
      position: relative;
    }

    /* =========================================================
       Header — compact, single-row, sticky
       ========================================================= */
    .hdr {
      flex: 0 0 auto;
      background: var(--header-bg);
      color: var(--header-text);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      padding-top: max(10px, env(safe-area-inset-top));
      border-bottom: 1px solid rgba(0, 197, 255, 0.18);
      z-index: 10;
    }
    .hdr__avatar {
      flex-shrink: 0;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(0, 197, 255, 0.1);
      border: 1px solid rgba(0, 197, 255, 0.3);
      display: grid; place-items: center;
      padding: 5px;
      overflow: hidden;
    }
    .hdr__avatar svg { width: 100%; height: 100%; display: block; }
    .hdr__title-block { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.1; }
    .hdr__name {
      font-family: 'Roboto', sans-serif;
      font-size: 16px; font-weight: 700;
      color: var(--header-text);
      letter-spacing: 0.2px;
      margin: 0;
    }
    .hdr__sub {
      font-family: 'Roboto', sans-serif;
      font-size: 11px; font-weight: 400;
      color: rgba(0, 197, 255, 0.7);
      margin-top: 2px;
      letter-spacing: 0.3px;
    }
    .hdr__sub::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ibi-cyan);
      margin-right: 5px; vertical-align: 1px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .hdr__actions { display: flex; align-items: center; gap: 4px; }
    .icon-btn {
      flex-shrink: 0;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: transparent;
      border: 0;
      color: var(--header-text);
      display: grid; place-items: center;
      cursor: pointer;
      transition: background 0.18s ease;
      padding: 0;
    }
    .icon-btn:hover { background: rgba(0, 197, 255, 0.12); }
    .icon-btn:active { background: rgba(0, 197, 255, 0.2); }
    .icon-btn:focus-visible { outline: 2px solid var(--ibi-cyan); outline-offset: 2px; }
    .icon-btn svg { width: 20px; height: 20px; }

    /* =========================================================
       Chat area — scrollable
       ========================================================= */
    .chat {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 12px;
      display: flex; flex-direction: column;
      gap: 4px;
      background-color: var(--chat-bg);
      background-image: radial-gradient(var(--bubble-pattern) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .chat__empty {
      margin: auto;
      padding: 32px 24px;
      text-align: center;
      color: var(--text-muted);
      max-width: 320px;
    }
    .chat__empty-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(0, 197, 255, 0.12);
      display: grid; place-items: center;
      margin: 0 auto 12px;
      color: var(--ibi-cyan);
    }
    .chat__empty-icon svg { width: 28px; height: 28px; }
    .chat__empty-title {
      font-family: 'Roboto', sans-serif;
      font-size: 16px; font-weight: 500;
      color: var(--text);
      margin: 0 0 4px;
    }
    .chat__empty-text {
      font-family: 'Roboto', sans-serif;
      font-size: 14px; line-height: 1.5;
      margin: 0;
    }

    .date-divider {
      align-self: center;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 12px; font-weight: 500;
      padding: 4px 12px;
      border-radius: 10px;
      box-shadow: var(--shadow-bubble);
      margin: 8px 0 4px;
      letter-spacing: 0.3px;
    }

    .msg {
      max-width: 78%;
      align-self: flex-end;
      background: var(--bubble-sent-bg);
      color: var(--bubble-sent-text);
      border-radius: 14px 14px 4px 14px;
      padding: 7px 10px 6px;
      box-shadow: var(--shadow-bubble);
      font-family: 'Roboto', sans-serif;
      font-size: 16px; line-height: 1.4;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      animation: bubbleIn 0.18s ease-out;
      position: relative;
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(4px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .msg__text {
      white-space: pre-wrap;
      margin: 0;
      padding-right: 56px;
      min-height: 18px;
    }
    .msg__meta {
      position: absolute;
      bottom: 4px; right: 8px;
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px;
      color: var(--bubble-sent-meta);
      font-weight: 500;
      pointer-events: none;
    }
    .msg__meta svg { width: 14px; height: 14px; }
    .msg__meta--failed { color: var(--error); }

    .msg--with-image .msg__text:empty { display: none; }
    .msg__image {
      display: block;
      width: 100%;
      max-width: 280px;
      max-height: 320px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 4px;
      cursor: zoom-in;
      background: rgba(0,0,0,0.05);
    }
    .msg--with-image .msg__text:not(:empty) { margin-top: 4px; padding-right: 56px; }
    .msg--image-only .msg__meta {
      bottom: 8px; right: 10px;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.95);
      padding: 2px 6px;
      border-radius: 8px;
    }

    .msg--sending { opacity: 0.65; }
    .msg--failed { background: #ffe5e5; color: #7a1f1f; }
    [data-theme="dark"] .msg--failed { background: #3a1414; color: #ffb4b4; }

    /* Image lightbox */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center; justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .lightbox--open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .lightbox__close {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 0;
      color: white;
      display: grid; place-items: center;
      cursor: pointer;
    }
    .lightbox__close svg { width: 20px; height: 20px; }

    /* Attachment preview strip (above input) */
    .attach-preview {
      flex: 0 0 auto;
      display: none;
      padding: 8px 12px;
      background: var(--input-bar-bg);
      border-top: 1px solid var(--border);
      gap: 10px;
      align-items: center;
    }
    .attach-preview--visible { display: flex; }
    .attach-preview__thumb {
      position: relative;
      width: 56px; height: 56px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface-2);
      flex-shrink: 0;
    }
    .attach-preview__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .attach-preview__remove {
      position: absolute;
      top: 2px; right: 2px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      border: 0;
      color: white;
      display: grid; place-items: center;
      cursor: pointer; padding: 0;
    }
    .attach-preview__remove svg { width: 12px; height: 12px; }
    .attach-preview__info {
      flex: 1; min-width: 0;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.3;
    }
    .attach-preview__info strong { color: var(--text); display: block; font-weight: 500; }

    /* =========================================================
       Input bar — sticky bottom
       ========================================================= */
    .input-bar {
      flex: 0 0 auto;
      background: var(--input-bar-bg);
      border-top: 1px solid var(--border);
      padding: 8px 8px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .input-bar__textwrap {
      flex: 1; min-width: 0;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      display: flex; align-items: flex-end;
      padding: 4px 8px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .input-bar__textwrap:focus-within {
      border-color: var(--ibi-cyan);
      box-shadow: 0 0 0 3px rgba(0, 197, 255, 0.15);
    }
    .input-bar__attach {
      flex-shrink: 0;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: transparent;
      border: 0;
      color: var(--text-muted);
      display: grid; place-items: center;
      cursor: pointer; padding: 0;
      transition: color 0.18s ease, background 0.18s ease;
    }
    .input-bar__attach:hover { color: var(--ibi-cyan); background: rgba(0, 197, 255, 0.1); }
    .input-bar__attach:focus-visible { outline: 2px solid var(--ibi-cyan); outline-offset: 2px; }
    .input-bar__attach svg { width: 22px; height: 22px; }
    .input-bar__textarea {
      flex: 1;
      border: 0; outline: 0;
      background: transparent;
      resize: none;
      font-family: 'Roboto', sans-serif;
      font-size: 16px; line-height: 1.4;
      color: var(--text);
      padding: 8px 4px;
      max-height: 140px;
      min-height: 24px;
    }
    .input-bar__textarea::placeholder { color: var(--text-soft); }
    .input-bar__send {
      flex-shrink: 0;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--ibi-cyan);
      color: #000;
      border: 0;
      cursor: pointer;
      display: grid; place-items: center;
      transition: transform 0.12s ease, background 0.18s ease, opacity 0.18s ease;
      padding: 0;
      box-shadow: 0 2px 8px rgba(0, 197, 255, 0.4);
    }
    .input-bar__send:hover:not(:disabled) { background: var(--ibi-cyan-strong); transform: scale(1.04); }
    .input-bar__send:active:not(:disabled) { transform: scale(0.96); }
    .input-bar__send:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    .input-bar__send:focus-visible { outline: 2px solid var(--ibi-cyan); outline-offset: 2px; }
    .input-bar__send svg { width: 20px; height: 20px; transform: translateX(1px); }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(0,0,0,0.25);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast-host {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      z-index: 150;
      display: flex; flex-direction: column;
      gap: 8px;
      width: min(92vw, 420px);
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--ibi-cyan);
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: var(--shadow-elevated);
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      color: var(--text);
      display: flex; align-items: flex-start;
      gap: 10px;
      animation: toastIn 0.22s ease-out;
    }
    .toast--success { border-left-color: var(--success); }
    .toast--error { border-left-color: var(--error); }
    .toast__icon { flex-shrink: 0; margin-top: 1px; }
    .toast__msg { flex: 1; line-height: 1.45; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: none; }
    }

    /* Menu */
    .menu-host { position: relative; }
    .menu {
      position: absolute;
      top: 100%; right: 0;
      margin-top: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-elevated);
      min-width: 200px;
      padding: 6px;
      display: none;
      z-index: 60;
    }
    .menu--open { display: block; }
    .menu__item {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border: 0;
      background: transparent;
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      color: var(--text);
      text-align: left;
      border-radius: 6px;
      cursor: pointer;
    }
    .menu__item:hover { background: var(--surface-2); }
    .menu__item--danger { color: var(--error); }
    .menu__item svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* Tablet / desktop refinements */
    @media (min-width: 720px) {
      body { padding: 0; background: #0a0d12; }
      [data-theme="light"] body { background: #d8dee5; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- =================== HEADER =================== -->
    <header class="hdr">
      <div class="hdr__avatar" aria-hidden="true">
        <!-- IBI dot-grid (matches the brand mark in the company logo) -->
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <g fill="#00c5ff">
            <circle cx="4"  cy="4"  r="1.4"/><circle cx="10" cy="4"  r="1.6"/><circle cx="16" cy="4"  r="1.8"/><circle cx="22" cy="4"  r="2.0"/><circle cx="28" cy="4"  r="2.2"/>
            <circle cx="4"  cy="10" r="1.4"/><circle cx="10" cy="10" r="1.6"/><circle cx="16" cy="10" r="1.8"/><circle cx="22" cy="10" r="2.0"/><circle cx="28" cy="10" r="2.2"/>
            <circle cx="4"  cy="16" r="1.4"/><circle cx="10" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.8"/><circle cx="22" cy="16" r="2.0"/><circle cx="28" cy="16" r="2.2"/>
            <circle cx="4"  cy="22" r="1.4"/><circle cx="10" cy="22" r="1.6"/><circle cx="16" cy="22" r="1.8"/><circle cx="22" cy="22" r="2.0"/><circle cx="28" cy="22" r="2.2"/>
            <circle cx="4"  cy="28" r="1.4"/><circle cx="10" cy="28" r="1.6"/><circle cx="16" cy="28" r="1.8"/><circle cx="22" cy="28" r="2.0"/><circle cx="28" cy="28" r="2.2"/>
          </g>
        </svg>
      </div>

      <div class="hdr__title-block">
        <span class="hdr__name">IBI Messenger</span>
        <span class="hdr__sub">Connected to Google Doc</span>
      </div>

      <div class="hdr__actions">
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>

        <div class="menu-host">
          <button type="button" class="icon-btn" id="menuBtn" aria-label="More options" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="6"  r="1.6"/>
              <circle cx="12" cy="12" r="1.6"/>
              <circle cx="12" cy="18" r="1.6"/>
            </svg>
          </button>
          <div class="menu" id="menu" role="menu">
            <button type="button" class="menu__item" id="openDocBtn" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
              Open Google Doc
            </button>
            <button type="button" class="menu__item menu__item--danger" id="clearHistoryBtn" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
              Clear local history
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- =================== CHAT =================== -->
    <main class="chat" id="chat" role="log" aria-live="polite" aria-label="Message history"></main>

    <!-- =================== ATTACHMENT PREVIEW =================== -->
    <div class="attach-preview" id="attachPreview">
      <div class="attach-preview__thumb">
        <img id="attachThumb" alt="" />
        <button type="button" class="attach-preview__remove" id="attachRemove" aria-label="Remove attachment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="attach-preview__info">
        <strong id="attachName">image.jpg</strong>
        <span id="attachSize">— KB</span>
      </div>
    </div>

    <!-- =================== INPUT BAR =================== -->
    <div class="input-bar">
      <button type="button" class="input-bar__attach" id="attachBtn" aria-label="Attach image" title="Attach image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="m21 15-5-5L5 21"/>
        </svg>
      </button>

      <div class="input-bar__textwrap">
        <textarea id="messageInput" class="input-bar__textarea" placeholder="Type a message…" rows="1" aria-label="Message" spellcheck="true"></textarea>
      </div>

      <button type="button" class="input-bar__send" id="sendBtn" aria-label="Send" disabled>
        <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>

      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Image preview" aria-modal="true">
    <button type="button" class="lightbox__close" id="lightboxClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <img id="lightboxImg" alt="" />
  </div>

  <div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="true"></div>

  <script>
    // =========================================================
    // CONFIG
    // =========================================================
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyq_EFb5FjDlbICwEn1_Sp_ZbZPbRBQq9Zm18bd1LZeP1h6MQQfPG_viqIuBEa9q2LOjA/exec';
    const GOOGLE_DOC_URL  = 'https://docs.google.com/document/d/1Zr65LApW5RtWbtiFzhAYSeQOVC-vDk8BHsrKxTAN7pw/edit';

    const STORAGE_KEY  = 'ibi-messenger-history-v1';
    const THEME_KEY    = 'ibi-theme';
    const HISTORY_LIMIT = 200;
    const IMAGE_MAX_DIMENSION = 1280;
    const IMAGE_QUALITY = 0.85;

    // =========================================================
    // Refs
    // =========================================================
    const $ = (id) => document.getElementById(id);
    const chatEl = $('chat');
    const messageInput = $('messageInput');
    const sendBtn = $('sendBtn');
    const sendIcon = $('sendIcon');
    const attachBtn = $('attachBtn');
    const fileInput = $('fileInput');
    const attachPreview = $('attachPreview');
    const attachThumb = $('attachThumb');
    const attachName = $('attachName');
    const attachSize = $('attachSize');
    const attachRemove = $('attachRemove');
    const themeToggle = $('themeToggle');
    const themeIcon = $('themeIcon');
    const themeMeta = $('theme-color-meta');
    const menuBtn = $('menuBtn');
    const menu = $('menu');
    const openDocBtn = $('openDocBtn');
    const clearHistoryBtn = $('clearHistoryBtn');
    const toastHost = $('toastHost');
    const lightbox = $('lightbox');
    const lightboxImg = $('lightboxImg');
    const lightboxClose = $('lightboxClose');

    // =========================================================
    // State
    // =========================================================
    let history = loadHistory();
    let pendingImage = null;

    // =========================================================
    // Theme
    // =========================================================
    const SUN_PATH = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
    const MOON_PATH = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

    function applyTheme(mode) {
      document.documentElement.setAttribute('data-theme', mode);
      themeIcon.innerHTML = mode === 'dark' ? MOON_PATH : SUN_PATH;
      if (themeMeta) themeMeta.setAttribute('content', mode === 'dark' ? '#0a0d12' : '#000000');
      try { localStorage.setItem(THEME_KEY, mode); } catch(_) {}
    }
    function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem(THEME_KEY); } catch(_) {}
      if (saved === 'dark' || saved === 'light') { applyTheme(saved); return; }
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark ? 'dark' : 'light');
    }
    themeToggle.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    });
    initTheme();

    // =========================================================
    // History persistence
    // =========================================================
    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch(_) { return []; }
    }
    function saveHistory() {
      try {
        if (history.length > HISTORY_LIMIT) {
          history = history.slice(history.length - HISTORY_LIMIT);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      } catch (e) {
        // Quota exceeded — drop image data URLs from older entries
        try {
          history = history.map((m, idx) => {
            if (idx < history.length - 30 && m.imageDataUrl) {
              const copy = Object.assign({}, m);
              delete copy.imageDataUrl;
              copy.imageDropped = true;
              return copy;
            }
            return m;
          });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        } catch(_) {}
      }
    }

    // =========================================================
    // Date helpers
    // =========================================================
    function formatTime(date) {
      try {
        return date.toLocaleString('en-IN', {
          timeZone: 'Asia/Kolkata',
          hour: '2-digit', minute: '2-digit', hour12: true
        });
      } catch(_) { return date.toLocaleTimeString(); }
    }
    function formatDateLabel(date) {
      const today = new Date(); today.setHours(0,0,0,0);
      const yest = new Date(today.getTime() - 86400000);
      const d = new Date(date); d.setHours(0,0,0,0);
      if (d.getTime() === today.getTime()) return 'Today';
      if (d.getTime() === yest.getTime()) return 'Yesterday';
      return new Date(date).toLocaleDateString('en-IN', {
        timeZone: 'Asia/Kolkata',
        day: '2-digit', month: 'long', year: 'numeric'
      });
    }
    function isoToDateKey(iso) {
      const d = new Date(iso);
      d.setHours(0,0,0,0);
      return d.getTime();
    }

    // =========================================================
    // Render
    // =========================================================
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderChat() {
      chatEl.innerHTML = '';
      if (!history.length) {
        const empty = document.createElement('div');
        empty.className = 'chat__empty';
        empty.innerHTML =
          '<div class="chat__empty-icon">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' +
            '</svg>' +
          '</div>' +
          '<p class="chat__empty-title">No messages yet</p>' +
          '<p class="chat__empty-text">Type a message or attach an image — it will be saved to your IBI Google Doc with a timestamp.</p>';
        chatEl.appendChild(empty);
        return;
      }
      let lastDateKey = null;
      history.forEach(msg => {
        const dKey = isoToDateKey(msg.timestamp);
        if (dKey !== lastDateKey) {
          const div = document.createElement('div');
          div.className = 'date-divider';
          div.textContent = formatDateLabel(msg.timestamp);
          chatEl.appendChild(div);
          lastDateKey = dKey;
        }
        chatEl.appendChild(renderMessage(msg));
      });
      requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; });
    }

    function renderMessage(msg) {
      const el = document.createElement('div');
      el.className = 'msg';
      if (msg.imageDataUrl) el.classList.add('msg--with-image');
      if (msg.imageDataUrl && !msg.text) el.classList.add('msg--image-only');
      if (msg.status === 'sending') el.classList.add('msg--sending');
      if (msg.status === 'failed')  el.classList.add('msg--failed');
      el.dataset.id = msg.id;

      let html = '';
      if (msg.imageDataUrl) {
        html += '<img class="msg__image" src="' + msg.imageDataUrl + '" alt="Attachment" />';
      } else if (msg.imageDropped) {
        html += '<div style="opacity:.7;font-size:13px;font-style:italic;padding:6px 0;">[Image — dropped from local cache]</div>';
      }
      html += '<p class="msg__text">' + (msg.text ? escapeHtml(msg.text) : '') + '</p>';

      const time = formatTime(new Date(msg.timestamp));
      let statusIcon = '';
      if (msg.status === 'sending') {
        statusIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
      } else if (msg.status === 'failed') {
        statusIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>';
      } else {
        statusIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13l3 3 7-7"/><path d="M9 13l3 3 9-9"/></svg>';
      }
      const metaCls = msg.status === 'failed' ? 'msg__meta msg__meta--failed' : 'msg__meta';
      html += '<span class="' + metaCls + '">' + time + ' ' + statusIcon + '</span>';
      el.innerHTML = html;

      const img = el.querySelector('img.msg__image');
      if (img) img.addEventListener('click', () => openLightbox(msg.imageDataUrl));
      return el;
    }

    // =========================================================
    // Lightbox
    // =========================================================
    function openLightbox(src) { lightboxImg.src = src; lightbox.classList.add('lightbox--open'); }
    function closeLightbox() { lightbox.classList.remove('lightbox--open'); lightboxImg.src = ''; }
    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && lightbox.classList.contains('lightbox--open')) closeLightbox(); });

    // =========================================================
    // Toast
    // =========================================================
    function showToast(msg, type, timeout) {
      type = type || 'info';
      timeout = timeout || 3500;
      const t = document.createElement('div');
      t.className = 'toast' + (type === 'success' ? ' toast--success' : type === 'error' ? ' toast--error' : '');
      const icons = {
        success: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
        error:   '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
        info:    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00c5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
      };
      t.innerHTML = '<span class="toast__icon">' + (icons[type] || icons.info) + '</span><span class="toast__msg">' + msg + '</span>';
      toastHost.appendChild(t);
      setTimeout(() => {
        t.style.transition = 'opacity .2s, transform .2s';
        t.style.opacity = '0';
        t.style.transform = 'translateY(-4px)';
        setTimeout(() => t.remove(), 220);
      }, timeout);
    }

    // =========================================================
    // Image attach + compress
    // =========================================================
    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      fileInput.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Please select an image file.', 'error');
        return;
      }
      try {
        const compressed = await compressImage(file);
        pendingImage = Object.assign({ name: file.name }, compressed);
        attachThumb.src = compressed.dataUrl;
        attachName.textContent = file.name;
        attachSize.textContent = (compressed.size / 1024).toFixed(0) + ' KB · ' + compressed.width + '×' + compressed.height;
        attachPreview.classList.add('attach-preview--visible');
        updateSendButton();
        messageInput.focus();
      } catch (err) {
        console.error(err);
        showToast('Could not load that image: ' + (err.message || err), 'error');
      }
    });

    attachRemove.addEventListener('click', clearAttachment);
    function clearAttachment() {
      pendingImage = null;
      attachThumb.src = '';
      attachPreview.classList.remove('attach-preview--visible');
      updateSendButton();
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Failed to read file.'));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error('Invalid image.'));
          img.onload = () => {
            const max = IMAGE_MAX_DIMENSION;
            let w = img.width, h = img.height;
            const ratio = Math.min(max / w, max / h, 1);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            canvas.toBlob((blob) => {
              if (!blob) { reject(new Error('Compression failed.')); return; }
              const reader2 = new FileReader();
              reader2.onerror = () => reject(new Error('Failed to encode.'));
              reader2.onload = () => {
                const dataUrl = reader2.result;
                const base64 = dataUrl.split(',')[1];
                resolve({ dataUrl, base64, mimeType: 'image/jpeg', width: w, height: h, size: blob.size });
              };
              reader2.readAsDataURL(blob);
            }, 'image/jpeg', IMAGE_QUALITY);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // =========================================================
    // Auto-grow + send button state
    // =========================================================
    function autoGrow() {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
    }
    function updateSendButton() {
      const hasContent = messageInput.value.trim().length > 0 || !!pendingImage;
      sendBtn.disabled = !hasContent;
    }
    messageInput.addEventListener('input', () => { autoGrow(); updateSendButton(); });
    messageInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });

    // =========================================================
    // Send
    // =========================================================
    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text && !pendingImage) return;
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.indexOf('PASTE_YOUR_DEPLOYED') !== -1) {
        showToast('Backend URL not configured.', 'error');
        return;
      }

      const id = 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const msg = {
        id, text,
        imageDataUrl: pendingImage ? pendingImage.dataUrl : null,
        timestamp: new Date().toISOString(),
        status: 'sending'
      };
      const imagePayload = pendingImage ? {
        base64: pendingImage.base64,
        mimeType: pendingImage.mimeType,
        width: pendingImage.width,
        height: pendingImage.height,
        name: pendingImage.name
      } : null;

      // Optimistic UI
      history.push(msg);
      saveHistory();
      renderChat();
      const sentText = text;
      messageInput.value = '';
      autoGrow();
      clearAttachment();
      setSending(true);

      const payload = {
        message: sentText,
        clientTimestamp: msg.timestamp,
        source: 'IBI Messenger Web',
        userAgent: navigator.userAgent
      };
      if (imagePayload) payload.image = imagePayload;
      const body = JSON.stringify(payload);

      // Attempt 1: regular fetch
      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body, redirect: 'follow'
        });
        if (!res.ok) throw new Error('Server responded ' + res.status);
        const raw = await res.text();
        let data = null; try { data = JSON.parse(raw); } catch(_) {}
        if (data && data.ok === false) throw new Error(data.error || 'Backend rejected');
        markStatus(id, 'sent');
        setSending(false);
        return;
      } catch (err) {
        if (!(err instanceof TypeError)) {
          console.error('Server error:', err);
          markStatus(id, 'failed');
          showToast('Send failed: ' + (err.message || err), 'error', 5500);
          setSending(false);
          return;
        }
        console.warn('CORS fetch failed, trying no-cors:', err);
      }

      // Attempt 2: no-cors fallback
      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body
        });
        markStatus(id, 'sent');
      } catch (err2) {
        console.error('no-cors also failed:', err2);
        markStatus(id, 'failed');
        showToast('Could not reach the backend. Check GAS deployment access settings.', 'error', 6500);
      } finally {
        setSending(false);
      }
    }

    function markStatus(id, status) {
      const m = history.find(x => x.id === id);
      if (m) { m.status = status; saveHistory(); }
      const node = chatEl.querySelector('[data-id="' + id + '"]');
      if (node && m) {
        const fresh = renderMessage(m);
        node.replaceWith(fresh);
      }
    }

    function setSending(isSending) {
      if (isSending) {
        const cur = $('sendIcon');
        if (cur) cur.outerHTML = '<span id="sendIcon" class="spinner" aria-hidden="true"></span>';
        sendBtn.disabled = true;
      } else {
        const sp = $('sendIcon');
        if (sp) sp.outerHTML = '<svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>';
        updateSendButton();
      }
    }

    // =========================================================
    // Menu
    // =========================================================
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = menu.classList.toggle('menu--open');
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && e.target !== menuBtn) {
        menu.classList.remove('menu--open');
        menuBtn.setAttribute('aria-expanded', 'false');
      }
    });
    openDocBtn.addEventListener('click', () => {
      window.open(GOOGLE_DOC_URL, '_blank', 'noopener');
      menu.classList.remove('menu--open');
    });
    clearHistoryBtn.addEventListener('click', () => {
      menu.classList.remove('menu--open');
      if (!history.length) { showToast('History is already empty.', 'info'); return; }
      if (confirm('Clear local message history?\n\n(This only clears what you see here. Your Google Doc archive is untouched.)')) {
        history = [];
        saveHistory();
        renderChat();
        showToast('Local history cleared.', 'success');
      }
    });

    // =========================================================
    // Init
    // =========================================================
    renderChat();
    updateSendButton();
    autoGrow();
    setTimeout(() => messageInput.focus(), 200);
  </script>
</body>
</html>
