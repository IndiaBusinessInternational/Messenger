<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" id="theme-color-meta" />
  <meta name="description" content="IBI Messenger — two-way chat between owner and staff, archived in Google Sheets." />

  <title>IBI Messenger</title>

  <meta property="og:title" content="IBI Messenger" />
  <meta property="og:type" content="website" />

  <!-- Favicon: 'IBI' text in #00c5ff on black, Roboto, as inline SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%23000000'/><text x='50%25' y='50%25' dy='.06em' text-anchor='middle' dominant-baseline='middle' font-family='Roboto, Arial, sans-serif' font-weight='900' font-size='22' fill='%2300c5ff' letter-spacing='-0.5'>IBI</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%23000000'/><text x='50%25' y='50%25' dy='.06em' text-anchor='middle' dominant-baseline='middle' font-family='Roboto, Arial, sans-serif' font-weight='900' font-size='22' fill='%2300c5ff' letter-spacing='-0.5'>IBI</text></svg>" />

  <!-- Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       IBI MESSENGER  —  Two-way WhatsApp-style chat
       Brand: #00c5ff cyan on #000 black, Roboto 16px
       ========================================================= */
    :root {
      --ibi-cyan: #00c5ff;
      --ibi-cyan-strong: #00aee0;
      --ibi-black: #000000;

      /* Light theme */
      --bg: #e8edf2;
      --chat-bg: #e8edf2;
      --surface: #ffffff;
      --surface-2: #f4f6fa;
      --text: #14181d;
      --text-muted: #5b6671;
      --text-soft: #8a96a3;
      --border: #d6dde5;
      --bubble-sent-bg: #00c5ff;
      --bubble-sent-text: #001a22;
      --bubble-sent-meta: rgba(0, 26, 34, 0.65);
      --bubble-recv-bg: #ffffff;
      --bubble-recv-text: #14181d;
      --bubble-recv-meta: #8a96a3;
      --sender-name-color: #00aee0;
      --input-bar-bg: #f4f6fa;
      --input-bg: #ffffff;
      --header-bg: #000000;
      --header-text: #00c5ff;
      --shadow-bubble: 0 1px 1.5px rgba(0, 0, 0, 0.08);
      --shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.08);
      --success: #10b981;
      --error: #ef4444;
      --bubble-pattern: rgba(0, 0, 0, 0.025);
    }
    [data-theme="dark"] {
      --bg: #0a0d12;
      --chat-bg: #0e131a;
      --surface: #131a23;
      --surface-2: #1a2230;
      --text: #f1f5f9;
      --text-muted: #a3b1c0;
      --text-soft: #6c7a8a;
      --border: #232c38;
      --bubble-sent-bg: #00c5ff;
      --bubble-sent-text: #001a22;
      --bubble-sent-meta: rgba(0, 26, 34, 0.7);
      --bubble-recv-bg: #1c2532;
      --bubble-recv-text: #e6edf5;
      --bubble-recv-meta: #6c7a8a;
      --sender-name-color: #00c5ff;
      --input-bar-bg: #131a23;
      --input-bg: #1a2230;
      --shadow-bubble: 0 1px 1.5px rgba(0, 0, 0, 0.4);
      --shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.4);
      --bubble-pattern: rgba(255, 255, 255, 0.03);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      font-family: 'Roboto', system-ui, -apple-system, sans-serif;
      font-size: 16px; line-height: 1.45;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .app {
      display: flex; flex-direction: column;
      height: 100dvh; height: 100vh;
      max-width: 720px; margin: 0 auto;
      background: var(--chat-bg);
      box-shadow: var(--shadow-elevated);
      position: relative;
    }

    /* ============ Header ============ */
    .hdr {
      flex: 0 0 auto;
      background: var(--header-bg);
      color: var(--header-text);
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      padding-top: max(10px, env(safe-area-inset-top));
      border-bottom: 1px solid rgba(0, 197, 255, 0.18);
      z-index: 10;
    }
    .hdr__avatar {
      flex-shrink: 0;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(0, 197, 255, 0.1);
      border: 1px solid rgba(0, 197, 255, 0.3);
      display: grid; place-items: center;
      padding: 5px; overflow: hidden;
    }
    .hdr__avatar svg { width: 100%; height: 100%; display: block; }
    .hdr__title-block { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.1; }
    .hdr__name {
      font-family: 'Roboto', sans-serif;
      font-size: 16px; font-weight: 700;
      color: var(--header-text);
      letter-spacing: 0.2px; margin: 0;
    }
    .hdr__sub {
      font-family: 'Roboto', sans-serif;
      font-size: 11px; font-weight: 400;
      color: rgba(0, 197, 255, 0.7);
      margin-top: 2px; letter-spacing: 0.3px;
      display: flex; align-items: center; gap: 5px;
    }
    .hdr__dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ibi-cyan);
      animation: pulse 2s ease-in-out infinite;
    }
    .hdr__dot--offline { background: #888; animation: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .hdr__actions { display: flex; align-items: center; gap: 4px; }
    .icon-btn {
      flex-shrink: 0;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: transparent; border: 0;
      color: var(--header-text);
      display: grid; place-items: center;
      cursor: pointer; padding: 0;
      transition: background 0.18s ease;
    }
    .icon-btn:hover { background: rgba(0, 197, 255, 0.12); }
    .icon-btn:active { background: rgba(0, 197, 255, 0.2); }
    .icon-btn:focus-visible { outline: 2px solid var(--ibi-cyan); outline-offset: 2px; }
    .icon-btn svg { width: 20px; height: 20px; }

    /* ============ Chat area ============ */
    .chat {
      flex: 1 1 auto;
      overflow-y: auto; overflow-x: hidden;
      padding: 14px 12px;
      display: flex; flex-direction: column;
      gap: 4px;
      background-color: var(--chat-bg);
      background-image: radial-gradient(var(--bubble-pattern) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .chat__empty {
      margin: auto;
      padding: 32px 24px;
      text-align: center;
      color: var(--text-muted);
      max-width: 320px;
    }
    .chat__empty-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(0, 197, 255, 0.12);
      display: grid; place-items: center;
      margin: 0 auto 12px;
      color: var(--ibi-cyan);
    }
    .chat__empty-icon svg { width: 28px; height: 28px; }
    .chat__empty-title {
      font-family: 'Roboto', sans-serif;
      font-size: 16px; font-weight: 500;
      color: var(--text); margin: 0 0 4px;
    }
    .chat__empty-text {
      font-family: 'Roboto', sans-serif;
      font-size: 14px; line-height: 1.5;
      margin: 0;
    }

    .date-divider {
      align-self: center;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 12px; font-weight: 500;
      padding: 4px 12px;
      border-radius: 10px;
      box-shadow: var(--shadow-bubble);
      margin: 8px 0 4px;
      letter-spacing: 0.3px;
    }

    /* Sender name label (only above received bubbles, only on group head) */
    .sender-label {
      align-self: flex-start;
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--sender-name-color);
      padding: 4px 4px 0 12px;
      max-width: 78%;
      letter-spacing: 0.2px;
    }

    /* Message bubble — base */
    .msg {
      max-width: 78%;
      padding: 7px 10px 6px;
      box-shadow: var(--shadow-bubble);
      font-family: 'Roboto', sans-serif;
      font-size: 16px; line-height: 1.4;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      animation: bubbleIn 0.18s ease-out;
      position: relative;
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(4px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    /* Sent (own) — cyan, right-aligned */
    .msg--sent {
      align-self: flex-end;
      background: var(--bubble-sent-bg);
      color: var(--bubble-sent-text);
      border-radius: 14px 14px 4px 14px;
    }
    .msg--sent .msg__meta { color: var(--bubble-sent-meta); }
    /* Received (other) — light, left-aligned */
    .msg--recv {
      align-self: flex-start;
      background: var(--bubble-recv-bg);
      color: var(--bubble-recv-text);
      border-radius: 14px 14px 14px 4px;
    }
    .msg--recv .msg__meta { color: var(--bubble-recv-meta); }

    /* Group spacing — tighter inside same-sender group */
    .msg + .msg.msg--sent { margin-top: 1px; }
    .msg + .msg.msg--recv { margin-top: 1px; }
    /* Loosen when sender alternates */
    .msg--recv + .msg--sent, .msg--sent + .msg--recv,
    .sender-label + .msg, .date-divider + .msg { margin-top: 6px; }

    .msg__text {
      white-space: pre-wrap;
      margin: 0;
      padding-right: 56px;
      min-height: 18px;
    }
    .msg__meta {
      position: absolute;
      bottom: 4px; right: 8px;
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px;
      font-weight: 500;
      pointer-events: none;
    }
    .msg__meta svg { width: 14px; height: 14px; }
    .msg__meta--failed { color: var(--error) !important; }

    .msg--with-image .msg__text:empty { display: none; }
    .msg__image-wrap {
      display: block;
      width: 100%;
      max-width: 280px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 4px;
      cursor: zoom-in;
      background: rgba(0,0,0,0.06);
      position: relative;
    }
    .msg__image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      max-height: 320px;
    }
    .msg__image--placeholder {
      display: flex; align-items: center; justify-content: center;
      width: 100%; aspect-ratio: 4 / 3;
      color: var(--text-soft);
      font-size: 13px;
      background: rgba(0,0,0,0.05);
    }
    [data-theme="dark"] .msg__image--placeholder { background: rgba(255,255,255,0.05); }
    .msg--with-image .msg__text:not(:empty) { margin-top: 4px; padding-right: 56px; }
    .msg--image-only .msg__meta {
      bottom: 8px; right: 10px;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.95) !important;
      padding: 2px 6px;
      border-radius: 8px;
    }
    .msg--sending { opacity: 0.65; }
    .msg--failed { background: #ffe5e5 !important; color: #7a1f1f !important; }
    [data-theme="dark"] .msg--failed { background: #3a1414 !important; color: #ffb4b4 !important; }

    /* ============ Lightbox ============ */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center; justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .lightbox--open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .lightbox__close {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 0; color: white;
      display: grid; place-items: center;
      cursor: pointer;
    }
    .lightbox__close svg { width: 20px; height: 20px; }

    /* ============ Attach preview ============ */
    .attach-preview {
      flex: 0 0 auto;
      display: none;
      padding: 8px 12px;
      background: var(--input-bar-bg);
      border-top: 1px solid var(--border);
      gap: 10px; align-items: center;
    }
    .attach-preview--visible { display: flex; }
    .attach-preview__thumb {
      position: relative;
      width: 56px; height: 56px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface-2);
      flex-shrink: 0;
    }
    .attach-preview__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .attach-preview__remove {
      position: absolute; top: 2px; right: 2px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      border: 0; color: white;
      display: grid; place-items: center;
      cursor: pointer; padding: 0;
    }
    .attach-preview__remove svg { width: 12px; height: 12px; }
    .attach-preview__info {
      flex: 1; min-width: 0;
      font-size: 13px; color: var(--text-muted);
      line-height: 1.3;
    }
    .attach-preview__info strong { color: var(--text); display: block; font-weight: 500; }

    /* ============ Input bar ============ */
    .input-bar {
      flex: 0 0 auto;
      background: var(--input-bar-bg);
      border-top: 1px solid var(--border);
      padding: 8px 8px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      display: flex; align-items: flex-end; gap: 6px;
    }
    .input-bar__textwrap {
      flex: 1; min-width: 0;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      display: flex; align-items: flex-end;
      padding: 4px 8px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .input-bar__textwrap:focus-within {
      border-color: var(--ibi-cyan);
      box-shadow: 0 0 0 3px rgba(0, 197, 255, 0.15);
    }
    .input-bar__attach {
      flex-shrink: 0;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: transparent; border: 0;
      color: var(--text-muted);
      display: grid; place-items: center;
      cursor: pointer; padding: 0;
      transition: color 0.18s ease, background 0.18s ease;
    }
    .input-bar__attach:hover { color: var(--ibi-cyan); background: rgba(0, 197, 255, 0.1); }
    .input-bar__attach:focus-visible { outline: 2px solid var(--ibi-cyan); outline-offset: 2px; }
    .input-bar__attach svg { width: 22px; height: 22px; }
    .input-bar__textarea {
      flex: 1;
      border: 0; outline: 0;
      background: transparent;
      resize: none;
      font-family: 'Roboto', sans-serif;
      font-size: 16px; line-height: 1.4;
      color: var(--text);
      padding: 8px 4px;
      max-height: 140px; min-height: 24px;
    }
    .input-bar__textarea::placeholder { color: var(--text-soft); }
    .input-bar__send {
      flex-shrink: 0;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--ibi-cyan);
      color: #000; border: 0;
      cursor: pointer;
      display: grid; place-items: center;
      transition: transform 0.12s ease, background 0.18s ease, opacity 0.18s ease;
      padding: 0;
      box-shadow: 0 2px 8px rgba(0, 197, 255, 0.4);
    }
    .input-bar__send:hover:not(:disabled) { background: var(--ibi-cyan-strong); transform: scale(1.04); }
    .input-bar__send:active:not(:disabled) { transform: scale(0.96); }
    .input-bar__send:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    .input-bar__send:focus-visible { outline: 2px solid var(--ibi-cyan); outline-offset: 2px; }
    .input-bar__send svg { width: 20px; height: 20px; transform: translateX(1px); }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(0,0,0,0.25);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ Toast ============ */
    .toast-host {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      z-index: 150;
      display: flex; flex-direction: column;
      gap: 8px;
      width: min(92vw, 420px);
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--ibi-cyan);
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: var(--shadow-elevated);
      font-family: 'Roboto', sans-serif;
      font-size: 14px; color: var(--text);
      display: flex; align-items: flex-start;
      gap: 10px;
      animation: toastIn 0.22s ease-out;
    }
    .toast--success { border-left-color: var(--success); }
    .toast--error { border-left-color: var(--error); }
    .toast__icon { flex-shrink: 0; margin-top: 1px; }
    .toast__msg { flex: 1; line-height: 1.45; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: none; }
    }

    /* ============ Menu ============ */
    .menu-host { position: relative; }
    .menu {
      position: absolute;
      top: 100%; right: 0;
      margin-top: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-elevated);
      min-width: 220px;
      padding: 6px;
      display: none;
      z-index: 60;
    }
    .menu--open { display: block; }
    .menu__item {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border: 0; background: transparent;
      font-family: 'Roboto', sans-serif;
      font-size: 14px; color: var(--text);
      text-align: left;
      border-radius: 6px;
      cursor: pointer;
    }
    .menu__item:hover { background: var(--surface-2); }
    .menu__item--danger { color: var(--error); }
    .menu__item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .menu__current {
      padding: 8px 10px 4px;
      font-size: 12px;
      color: var(--text-soft);
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .menu__current strong { color: var(--ibi-cyan); }

    /* ============ Identity modal ============ */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center; justify-content: center;
      z-index: 300;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    .modal-backdrop--open { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--surface);
      border-radius: 14px;
      width: 100%;
      max-width: 380px;
      padding: 24px;
      box-shadow: var(--shadow-elevated);
      animation: modalIn 0.25s ease-out;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: none; }
    }
    .modal__icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--ibi-black);
      color: var(--ibi-cyan);
      display: grid; place-items: center;
      margin: 0 auto 14px;
    }
    .modal__icon svg { width: 30px; height: 30px; }
    .modal__title {
      font-family: 'Roboto', sans-serif;
      font-size: 20px; font-weight: 700;
      color: var(--text);
      text-align: center;
      margin: 0 0 6px;
    }
    .modal__intro {
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin: 0 0 18px;
      line-height: 1.5;
    }
    .modal__field {
      display: block;
      width: 100%;
      padding: 12px 14px;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
      color: var(--text);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.18s, box-shadow 0.18s;
      margin-bottom: 14px;
    }
    .modal__field:focus {
      outline: 0;
      border-color: var(--ibi-cyan);
      box-shadow: 0 0 0 3px rgba(0, 197, 255, 0.15);
    }
    .modal__chips {
      display: flex; flex-wrap: wrap;
      gap: 6px;
      margin: -8px 0 14px;
    }
    .modal__chip {
      padding: 4px 10px;
      font-size: 13px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      color: var(--text);
      font-family: 'Roboto', sans-serif;
    }
    .modal__chip:hover { border-color: var(--ibi-cyan); color: var(--ibi-cyan); }
    .modal__actions { display: flex; gap: 8px; }
    .btn {
      font-family: 'Roboto', sans-serif;
      font-size: 15px; font-weight: 500;
      padding: 11px 18px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      flex: 1;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }
    .btn--primary {
      background: var(--ibi-cyan);
      color: #000;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 197, 255, 0.4);
    }
    .btn--primary:hover { background: var(--ibi-cyan-strong); }
    .btn--primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    .btn--ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text-muted);
    }
    .btn--ghost:hover { color: var(--text); border-color: var(--text-muted); }

    @media (min-width: 720px) {
      body { background: #0a0d12; }
      [data-theme="light"] body { background: #d8dee5; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- =================== HEADER =================== -->
    <header class="hdr">
      <div class="hdr__avatar" aria-hidden="true">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <g fill="#00c5ff">
            <circle cx="4"  cy="4"  r="1.4"/><circle cx="10" cy="4"  r="1.6"/><circle cx="16" cy="4"  r="1.8"/><circle cx="22" cy="4"  r="2.0"/><circle cx="28" cy="4"  r="2.2"/>
            <circle cx="4"  cy="10" r="1.4"/><circle cx="10" cy="10" r="1.6"/><circle cx="16" cy="10" r="1.8"/><circle cx="22" cy="10" r="2.0"/><circle cx="28" cy="10" r="2.2"/>
            <circle cx="4"  cy="16" r="1.4"/><circle cx="10" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.8"/><circle cx="22" cy="16" r="2.0"/><circle cx="28" cy="16" r="2.2"/>
            <circle cx="4"  cy="22" r="1.4"/><circle cx="10" cy="22" r="1.6"/><circle cx="16" cy="22" r="1.8"/><circle cx="22" cy="22" r="2.0"/><circle cx="28" cy="22" r="2.2"/>
            <circle cx="4"  cy="28" r="1.4"/><circle cx="10" cy="28" r="1.6"/><circle cx="16" cy="28" r="1.8"/><circle cx="22" cy="28" r="2.0"/><circle cx="28" cy="28" r="2.2"/>
          </g>
        </svg>
      </div>

      <div class="hdr__title-block">
        <span class="hdr__name">IBI Messenger</span>
        <span class="hdr__sub">
          <span class="hdr__dot" id="hdrDot"></span>
          <span id="hdrStatus">You: <strong id="hdrSenderName">—</strong></span>
        </span>
      </div>

      <div class="hdr__actions">
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
        <div class="menu-host">
          <button type="button" class="icon-btn" id="menuBtn" aria-label="More options" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="6" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg>
          </button>
          <div class="menu" id="menu" role="menu">
            <div class="menu__current">Signed in as <strong id="menuCurrentName">—</strong></div>
            <button type="button" class="menu__item" id="changeNameBtn" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Change my name
            </button>
            <button type="button" class="menu__item" id="openSheetBtn" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
              Open Google Sheet
            </button>
            <button type="button" class="menu__item" id="refreshBtn" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
              Refresh
            </button>
            <button type="button" class="menu__item menu__item--danger" id="clearHistoryBtn" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
              Clear local cache
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="chat" id="chat" role="log" aria-live="polite" aria-label="Chat history"></main>

    <div class="attach-preview" id="attachPreview">
      <div class="attach-preview__thumb">
        <img id="attachThumb" alt="" />
        <button type="button" class="attach-preview__remove" id="attachRemove" aria-label="Remove attachment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="attach-preview__info">
        <strong id="attachName">image.jpg</strong>
        <span id="attachSize">— KB</span>
      </div>
    </div>

    <div class="input-bar">
      <button type="button" class="input-bar__attach" id="attachBtn" aria-label="Attach image" title="Attach image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="m21 15-5-5L5 21"/>
        </svg>
      </button>
      <div class="input-bar__textwrap">
        <textarea id="messageInput" class="input-bar__textarea" placeholder="Type a message…" rows="1" aria-label="Message" spellcheck="true"></textarea>
      </div>
      <button type="button" class="input-bar__send" id="sendBtn" aria-label="Send" disabled>
        <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Image preview" aria-modal="true">
    <button type="button" class="lightbox__close" id="lightboxClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <img id="lightboxImg" alt="" />
  </div>

  <!-- Identity modal -->
  <div class="modal-backdrop" id="identityBackdrop">
    <div class="modal" role="dialog" aria-labelledby="identityTitle" aria-modal="true">
      <div class="modal__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <h2 class="modal__title" id="identityTitle">Who's using this device?</h2>
      <p class="modal__intro">Your name appears on every message you send so others can tell who said what.</p>
      <input type="text" id="identityInput" class="modal__field" placeholder="e.g. Owner, Aswin, Vinod…" maxlength="40" autocomplete="off" />
      <div class="modal__chips" id="identityChips">
        <span class="modal__chip" data-name="Owner">Owner</span>
        <span class="modal__chip" data-name="Aswin">Aswin</span>
        <span class="modal__chip" data-name="Vinod">Vinod</span>
        <span class="modal__chip" data-name="Staff">Staff</span>
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="identityCancel" hidden>Cancel</button>
        <button type="button" class="btn btn--primary" id="identitySave" disabled>Continue</button>
      </div>
    </div>
  </div>

  <div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="true"></div>

  <script>
    // =========================================================
    // CONFIG  (edit if you redeploy)
    // =========================================================
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyq_EFb5FjDlbICwEn1_Sp_ZbZPbRBQq9Zm18bd1LZeP1h6MQQfPG_viqIuBEa9q2LOjA/exec';
    const GOOGLE_SHEET_URL = ''; // optional — paste your Sheet URL to enable "Open Google Sheet" menu item

    const STORAGE_HISTORY_KEY = 'ibi-msgr-history-v2';
    const STORAGE_IDENTITY_KEY = 'ibi-msgr-identity-v1';
    const STORAGE_LASTSEEN_KEY = 'ibi-msgr-lastseen-v1';
    const THEME_KEY = 'ibi-theme';

    const HISTORY_LIMIT = 300;
    const POLL_INTERVAL_MS = 5000;
    const INITIAL_FETCH_LIMIT = 100;
    const IMAGE_MAX_DIMENSION = 1280;
    const IMAGE_QUALITY = 0.85;

    // =========================================================
    // DOM refs
    // =========================================================
    const $ = (id) => document.getElementById(id);
    const chatEl = $('chat');
    const messageInput = $('messageInput');
    const sendBtn = $('sendBtn');
    const attachBtn = $('attachBtn');
    const fileInput = $('fileInput');
    const attachPreview = $('attachPreview');
    const attachThumb = $('attachThumb');
    const attachName = $('attachName');
    const attachSize = $('attachSize');
    const attachRemove = $('attachRemove');
    const themeToggle = $('themeToggle');
    const themeIcon = $('themeIcon');
    const themeMeta = $('theme-color-meta');
    const menuBtn = $('menuBtn');
    const menu = $('menu');
    const changeNameBtn = $('changeNameBtn');
    const openSheetBtn = $('openSheetBtn');
    const refreshBtn = $('refreshBtn');
    const clearHistoryBtn = $('clearHistoryBtn');
    const menuCurrentName = $('menuCurrentName');
    const hdrSenderName = $('hdrSenderName');
    const hdrDot = $('hdrDot');
    const hdrStatus = $('hdrStatus');
    const toastHost = $('toastHost');
    const lightbox = $('lightbox');
    const lightboxImg = $('lightboxImg');
    const lightboxClose = $('lightboxClose');
    const identityBackdrop = $('identityBackdrop');
    const identityInput = $('identityInput');
    const identitySave = $('identitySave');
    const identityCancel = $('identityCancel');
    const identityChips = $('identityChips');

    // =========================================================
    // State
    // =========================================================
    let identity = loadIdentity();        // { senderId, sender }
    let history = loadHistory();          // [ msg, ... ]
    let pendingImage = null;
    let lastSeenTimestamp = loadLastSeen();
    let pollTimer = null;
    let pollInFlight = false;
    let isOnline = true;

    // =========================================================
    // Persistence
    // =========================================================
    function loadIdentity() {
      try {
        const raw = localStorage.getItem(STORAGE_IDENTITY_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (obj && obj.senderId && obj.sender) return obj;
        return null;
      } catch(_) { return null; }
    }
    function saveIdentity(obj) {
      try { localStorage.setItem(STORAGE_IDENTITY_KEY, JSON.stringify(obj)); } catch(_) {}
    }
    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_HISTORY_KEY);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch(_) { return []; }
    }
    function saveHistory() {
      try {
        if (history.length > HISTORY_LIMIT) {
          history = history.slice(history.length - HISTORY_LIMIT);
        }
        localStorage.setItem(STORAGE_HISTORY_KEY, JSON.stringify(history));
      } catch (e) {
        // quota — drop image data URLs from older entries
        try {
          history = history.map((m, idx) => {
            if (idx < history.length - 30 && m.imageDataUrl) {
              const c = Object.assign({}, m);
              delete c.imageDataUrl;
              c.imageDropped = true;
              return c;
            }
            return m;
          });
          localStorage.setItem(STORAGE_HISTORY_KEY, JSON.stringify(history));
        } catch(_) {}
      }
    }
    function loadLastSeen() {
      try { return localStorage.getItem(STORAGE_LASTSEEN_KEY) || ''; } catch(_) { return ''; }
    }
    function saveLastSeen(ts) {
      try { localStorage.setItem(STORAGE_LASTSEEN_KEY, ts); } catch(_) {}
      lastSeenTimestamp = ts;
    }

    // =========================================================
    // Theme
    // =========================================================
    const SUN_PATH = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
    const MOON_PATH = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    function applyTheme(mode) {
      document.documentElement.setAttribute('data-theme', mode);
      themeIcon.innerHTML = mode === 'dark' ? MOON_PATH : SUN_PATH;
      if (themeMeta) themeMeta.setAttribute('content', mode === 'dark' ? '#0a0d12' : '#000000');
      try { localStorage.setItem(THEME_KEY, mode); } catch(_) {}
    }
    function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem(THEME_KEY); } catch(_) {}
      if (saved === 'dark' || saved === 'light') { applyTheme(saved); return; }
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark ? 'dark' : 'light');
    }
    themeToggle.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    });
    initTheme();

    // =========================================================
    // Identity modal
    // =========================================================
    function showIdentityModal(isChange) {
      identityBackdrop.classList.add('modal-backdrop--open');
      if (isChange && identity) {
        identityInput.value = identity.sender;
        identityCancel.hidden = false;
      } else {
        identityInput.value = '';
        identityCancel.hidden = true;
      }
      identitySave.disabled = !identityInput.value.trim();
      setTimeout(() => identityInput.focus(), 50);
    }
    function hideIdentityModal() { identityBackdrop.classList.remove('modal-backdrop--open'); }

    identityInput.addEventListener('input', () => {
      identitySave.disabled = !identityInput.value.trim();
    });
    identityInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !identitySave.disabled) { e.preventDefault(); identitySave.click(); }
    });
    identityChips.addEventListener('click', (e) => {
      const chip = e.target.closest('.modal__chip');
      if (!chip) return;
      identityInput.value = chip.dataset.name;
      identitySave.disabled = false;
      identityInput.focus();
    });
    identitySave.addEventListener('click', () => {
      const name = identityInput.value.trim().substring(0, 40);
      if (!name) return;
      const senderId = (identity && identity.senderId) ? identity.senderId : ('sndr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10));
      identity = { senderId, sender: name };
      saveIdentity(identity);
      updateIdentityUI();
      hideIdentityModal();
      // If this is first set-up, kick off initial fetch and polling
      if (!pollTimer) {
        initialFetch().then(startPolling);
      }
    });
    identityCancel.addEventListener('click', hideIdentityModal);

    function updateIdentityUI() {
      const name = identity ? identity.sender : '—';
      hdrSenderName.textContent = name;
      menuCurrentName.textContent = name;
    }

    // =========================================================
    // Date helpers
    // =========================================================
    function formatTime(date) {
      try {
        return date.toLocaleString('en-IN', {
          timeZone: 'Asia/Kolkata',
          hour: '2-digit', minute: '2-digit', hour12: true
        });
      } catch(_) { return date.toLocaleTimeString(); }
    }
    function formatDateLabel(date) {
      const today = new Date(); today.setHours(0,0,0,0);
      const yest = new Date(today.getTime() - 86400000);
      const d = new Date(date); d.setHours(0,0,0,0);
      if (d.getTime() === today.getTime()) return 'Today';
      if (d.getTime() === yest.getTime()) return 'Yesterday';
      return new Date(date).toLocaleDateString('en-IN', {
        timeZone: 'Asia/Kolkata',
        day: '2-digit', month: 'long', year: 'numeric'
      });
    }
    function isoToDateKey(iso) {
      const d = new Date(iso); d.setHours(0,0,0,0);
      return d.getTime();
    }

    // =========================================================
    // Render
    // =========================================================
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function isMine(msg) {
      return identity && msg.senderId === identity.senderId;
    }

    function renderChat() {
      chatEl.innerHTML = '';
      if (!history.length) {
        const empty = document.createElement('div');
        empty.className = 'chat__empty';
        empty.innerHTML =
          '<div class="chat__empty-icon">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' +
            '</svg>' +
          '</div>' +
          '<p class="chat__empty-title">No messages yet</p>' +
          '<p class="chat__empty-text">Send a message and your team will see it on their devices in real time.</p>';
        chatEl.appendChild(empty);
        return;
      }

      // Sort by timestamp ascending (defensive — server already sorts)
      history.sort((a, b) => (a.timestamp < b.timestamp ? -1 : (a.timestamp > b.timestamp ? 1 : 0)));

      let lastDateKey = null;
      let lastSenderId = null;
      history.forEach(msg => {
        const dKey = isoToDateKey(msg.timestamp);
        if (dKey !== lastDateKey) {
          const div = document.createElement('div');
          div.className = 'date-divider';
          div.textContent = formatDateLabel(msg.timestamp);
          chatEl.appendChild(div);
          lastDateKey = dKey;
          lastSenderId = null;
        }

        // Sender label (only above received bubbles, only on group head)
        if (!isMine(msg) && msg.senderId !== lastSenderId) {
          const lbl = document.createElement('div');
          lbl.className = 'sender-label';
          lbl.textContent = msg.sender || 'Unknown';
          chatEl.appendChild(lbl);
        }
        chatEl.appendChild(renderMessage(msg));
        lastSenderId = msg.senderId;
      });
      requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; });
    }

    function renderMessage(msg) {
      const el = document.createElement('div');
      el.className = 'msg ' + (isMine(msg) ? 'msg--sent' : 'msg--recv');
      const hasImage = !!msg.imageDataUrl || !!msg.imageId;
      if (hasImage) el.classList.add('msg--with-image');
      if (hasImage && !msg.text) el.classList.add('msg--image-only');
      if (msg.status === 'sending') el.classList.add('msg--sending');
      if (msg.status === 'failed')  el.classList.add('msg--failed');
      el.dataset.id = msg.messageId || msg.id;

      let html = '';
      if (msg.imageDataUrl) {
        // Local data URL (own message, just sent)
        html += '<div class="msg__image-wrap"><img class="msg__image" src="' + msg.imageDataUrl + '" alt="Attachment" /></div>';
      } else if (msg.imageId) {
        // Drive-hosted image
        const w = msg.imageW || 800;
        const url = 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(msg.imageId) + '=w' + Math.min(Math.max(w, 320), 1600);
        const aspect = (msg.imageW && msg.imageH) ? (msg.imageW + ' / ' + msg.imageH) : '4 / 3';
        html += '<div class="msg__image-wrap" style="aspect-ratio:' + aspect + ';"><img class="msg__image" src="' + url + '" alt="Attachment" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML=\'<div class=msg__image--placeholder>Image unavailable</div>\'" /></div>';
      } else if (msg.imageDropped) {
        html += '<div style="opacity:.7;font-size:13px;font-style:italic;padding:6px 0;">[Image — dropped from local cache]</div>';
      }
      html += '<p class="msg__text">' + (msg.text ? escapeHtml(msg.text) : '') + '</p>';

      const time = formatTime(new Date(msg.timestamp));
      let statusIcon = '';
      if (isMine(msg)) {
        if (msg.status === 'sending') {
          statusIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
        } else if (msg.status === 'failed') {
          statusIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>';
        } else {
          statusIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13l3 3 7-7"/><path d="M9 13l3 3 9-9"/></svg>';
        }
      }
      const metaCls = msg.status === 'failed' ? 'msg__meta msg__meta--failed' : 'msg__meta';
      html += '<span class="' + metaCls + '">' + time + ' ' + statusIcon + '</span>';
      el.innerHTML = html;

      const img = el.querySelector('img.msg__image');
      if (img) {
        img.addEventListener('click', () => {
          const fullSrc = msg.imageDataUrl
            ? msg.imageDataUrl
            : (msg.imageId ? ('https://lh3.googleusercontent.com/d/' + encodeURIComponent(msg.imageId) + '=w2000') : '');
          if (fullSrc) openLightbox(fullSrc);
        });
      }
      return el;
    }

    // =========================================================
    // Lightbox
    // =========================================================
    function openLightbox(src) { lightboxImg.src = src; lightbox.classList.add('lightbox--open'); }
    function closeLightbox() { lightbox.classList.remove('lightbox--open'); lightboxImg.src = ''; }
    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && lightbox.classList.contains('lightbox--open')) closeLightbox(); });

    // =========================================================
    // Toast
    // =========================================================
    function showToast(msg, type, timeout) {
      type = type || 'info';
      timeout = timeout || 3500;
      const t = document.createElement('div');
      t.className = 'toast' + (type === 'success' ? ' toast--success' : type === 'error' ? ' toast--error' : '');
      const icons = {
        success: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
        error:   '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
        info:    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00c5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
      };
      t.innerHTML = '<span class="toast__icon">' + (icons[type] || icons.info) + '</span><span class="toast__msg">' + msg + '</span>';
      toastHost.appendChild(t);
      setTimeout(() => {
        t.style.transition = 'opacity .2s, transform .2s';
        t.style.opacity = '0';
        t.style.transform = 'translateY(-4px)';
        setTimeout(() => t.remove(), 220);
      }, timeout);
    }

    // =========================================================
    // Image attach + compress
    // =========================================================
    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      fileInput.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Please select an image file.', 'error');
        return;
      }
      try {
        const compressed = await compressImage(file);
        pendingImage = Object.assign({ name: file.name }, compressed);
        attachThumb.src = compressed.dataUrl;
        attachName.textContent = file.name;
        attachSize.textContent = (compressed.size / 1024).toFixed(0) + ' KB · ' + compressed.width + '×' + compressed.height;
        attachPreview.classList.add('attach-preview--visible');
        updateSendButton();
        messageInput.focus();
      } catch (err) {
        console.error(err);
        showToast('Could not load that image: ' + (err.message || err), 'error');
      }
    });
    attachRemove.addEventListener('click', clearAttachment);
    function clearAttachment() {
      pendingImage = null;
      attachThumb.src = '';
      attachPreview.classList.remove('attach-preview--visible');
      updateSendButton();
    }
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Failed to read file.'));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error('Invalid image.'));
          img.onload = () => {
            const max = IMAGE_MAX_DIMENSION;
            let w = img.width, h = img.height;
            const ratio = Math.min(max / w, max / h, 1);
            w = Math.round(w * ratio); h = Math.round(h * ratio);
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            canvas.toBlob((blob) => {
              if (!blob) { reject(new Error('Compression failed.')); return; }
              const reader2 = new FileReader();
              reader2.onerror = () => reject(new Error('Failed to encode.'));
              reader2.onload = () => {
                const dataUrl = reader2.result;
                const base64 = dataUrl.split(',')[1];
                resolve({ dataUrl, base64, mimeType: 'image/jpeg', width: w, height: h, size: blob.size });
              };
              reader2.readAsDataURL(blob);
            }, 'image/jpeg', IMAGE_QUALITY);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // =========================================================
    // Auto-grow + send button state
    // =========================================================
    function autoGrow() {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
    }
    function updateSendButton() {
      const hasContent = messageInput.value.trim().length > 0 || !!pendingImage;
      sendBtn.disabled = !hasContent || !identity;
    }
    messageInput.addEventListener('input', () => { autoGrow(); updateSendButton(); });
    messageInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });

    // =========================================================
    // Send
    // =========================================================
    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
      if (!identity) { showIdentityModal(false); return; }
      const text = messageInput.value.trim();
      if (!text && !pendingImage) return;
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.indexOf('PASTE_YOUR_DEPLOYED') !== -1) {
        showToast('Backend URL not configured.', 'error');
        return;
      }

      const messageId = 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
      const ts = new Date().toISOString();
      const localMsg = {
        messageId, timestamp: ts,
        sender: identity.sender,
        senderId: identity.senderId,
        type: pendingImage ? (text ? 'image+text' : 'image') : 'text',
        text,
        imageDataUrl: pendingImage ? pendingImage.dataUrl : null,
        imageId: '',
        imageW: pendingImage ? pendingImage.width : '',
        imageH: pendingImage ? pendingImage.height : '',
        status: 'sending'
      };
      const imagePayload = pendingImage ? {
        base64: pendingImage.base64,
        mimeType: pendingImage.mimeType,
        width: pendingImage.width,
        height: pendingImage.height,
        name: pendingImage.name
      } : null;

      // Optimistic UI
      history.push(localMsg);
      saveHistory();
      renderChat();
      messageInput.value = '';
      autoGrow();
      clearAttachment();
      setSending(true);

      const payload = {
        messageId,
        sender: identity.sender,
        senderId: identity.senderId,
        text,
        clientTimestamp: ts,
        userAgent: navigator.userAgent.substring(0, 200)
      };
      if (imagePayload) payload.image = imagePayload;
      const body = JSON.stringify(payload);

      // Attempt 1: regular fetch
      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body, redirect: 'follow'
        });
        if (!res.ok) throw new Error('Server responded ' + res.status);
        const raw = await res.text();
        let data = null; try { data = JSON.parse(raw); } catch(_) {}
        if (data && data.ok === false) throw new Error(data.error || 'Backend rejected');

        // Update message with server-assigned imageId/timestamp
        const m = history.find(x => x.messageId === messageId);
        if (m) {
          if (data && data.imageId) m.imageId = data.imageId;
          if (data && data.timestamp) m.timestamp = data.timestamp;
          m.status = 'sent';
          saveHistory();
          // Update lastSeen so polling skips this
          if (data && data.timestamp && data.timestamp > lastSeenTimestamp) {
            saveLastSeen(data.timestamp);
          }
          rerenderMessage(messageId);
        }
        setSending(false);
        return;
      } catch (err) {
        if (!(err instanceof TypeError)) {
          console.error('Server error:', err);
          markStatus(messageId, 'failed');
          showToast('Send failed: ' + (err.message || err), 'error', 5500);
          setSending(false);
          return;
        }
        console.warn('CORS fetch failed, trying no-cors:', err);
      }

      // Attempt 2: no-cors fallback
      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body
        });
        markStatus(messageId, 'sent');
        // Cannot read server's imageId — local imageDataUrl is enough for our own view
        // Polling will eventually return the canonical row, dedup by messageId.
      } catch (err2) {
        console.error('no-cors also failed:', err2);
        markStatus(messageId, 'failed');
        showToast('Could not reach the backend. Check the GAS deployment access setting.', 'error', 6500);
      } finally {
        setSending(false);
      }
    }

    function markStatus(messageId, status) {
      const m = history.find(x => x.messageId === messageId);
      if (m) { m.status = status; saveHistory(); }
      rerenderMessage(messageId);
    }
    function rerenderMessage(messageId) {
      const m = history.find(x => x.messageId === messageId);
      if (!m) return;
      const node = chatEl.querySelector('[data-id="' + messageId + '"]');
      if (node) node.replaceWith(renderMessage(m));
    }
    function setSending(isSending) {
      const cur = $('sendIcon');
      if (isSending) {
        if (cur && cur.tagName !== 'SPAN') {
          cur.outerHTML = '<span id="sendIcon" class="spinner" aria-hidden="true"></span>';
        }
        sendBtn.disabled = true;
      } else {
        if (cur && cur.tagName === 'SPAN') {
          cur.outerHTML = '<svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>';
        }
        updateSendButton();
      }
    }

    // =========================================================
    // Polling — fetch new messages
    // =========================================================
    function setOnline(online) {
      isOnline = online;
      hdrDot.classList.toggle('hdr__dot--offline', !online);
    }

    async function fetchSince(since) {
      if (pollInFlight) return;
      pollInFlight = true;
      try {
        const url = GAS_WEB_APP_URL + (GAS_WEB_APP_URL.indexOf('?') === -1 ? '?' : '&') +
                    'action=fetch&since=' + encodeURIComponent(since || '') + '&limit=' +
                    (since ? 200 : INITIAL_FETCH_LIMIT);
        const res = await fetch(url, { method: 'GET', redirect: 'follow' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data || data.ok === false) throw new Error((data && data.error) || 'Fetch failed');
        setOnline(true);
        return data;
      } catch (err) {
        console.warn('Fetch error:', err);
        setOnline(false);
        return null;
      } finally {
        pollInFlight = false;
      }
    }

    function mergeIncoming(messages) {
      if (!messages || !messages.length) return 0;
      const existingIds = new Set(history.map(m => m.messageId));
      let added = 0;
      let latestTs = lastSeenTimestamp;
      messages.forEach(srv => {
        if (!srv.messageId) return;
        if (existingIds.has(srv.messageId)) {
          // Update existing message in case server has newer info (e.g. imageId)
          const local = history.find(m => m.messageId === srv.messageId);
          if (local) {
            if (!local.imageId && srv.imageId) local.imageId = srv.imageId;
            if (srv.timestamp && srv.timestamp > local.timestamp) local.timestamp = srv.timestamp;
            // Don't overwrite local 'sending' or 'failed' with sent unless server confirms
            if (local.status !== 'failed') local.status = 'sent';
          }
        } else {
          history.push({
            messageId: srv.messageId,
            timestamp: srv.timestamp,
            sender: srv.sender,
            senderId: srv.senderId,
            type: srv.type,
            text: srv.text,
            imageId: srv.imageId,
            imageW: srv.imageW,
            imageH: srv.imageH,
            status: 'sent'
          });
          added++;
        }
        if (srv.timestamp > latestTs) latestTs = srv.timestamp;
      });
      saveLastSeen(latestTs);
      saveHistory();
      return added;
    }

    async function initialFetch() {
      const data = await fetchSince(lastSeenTimestamp);
      if (data && data.messages) {
        mergeIncoming(data.messages);
        if (data.now) saveLastSeen(data.now);
      }
      renderChat();
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(async () => {
        if (document.visibilityState === 'hidden') return;
        const data = await fetchSince(lastSeenTimestamp);
        if (!data || !data.messages || !data.messages.length) {
          if (data && data.now) saveLastSeen(data.now);
          return;
        }
        const added = mergeIncoming(data.messages);
        if (added > 0) renderChat();
      }, POLL_INTERVAL_MS);
    }
    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    // Pause polling when tab hidden, resume + immediate fetch when visible
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && identity) {
        fetchSince(lastSeenTimestamp).then(data => {
          if (data && data.messages) {
            const added = mergeIncoming(data.messages);
            if (added > 0) renderChat();
          }
        });
      }
    });

    // =========================================================
    // Menu
    // =========================================================
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = menu.classList.toggle('menu--open');
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
        menu.classList.remove('menu--open');
        menuBtn.setAttribute('aria-expanded', 'false');
      }
    });
    changeNameBtn.addEventListener('click', () => {
      menu.classList.remove('menu--open');
      showIdentityModal(true);
    });
    openSheetBtn.addEventListener('click', () => {
      menu.classList.remove('menu--open');
      if (GOOGLE_SHEET_URL) {
        window.open(GOOGLE_SHEET_URL, '_blank', 'noopener');
      } else {
        showToast('Sheet URL not configured. Edit GOOGLE_SHEET_URL in index.html.', 'info', 5500);
      }
    });
    refreshBtn.addEventListener('click', async () => {
      menu.classList.remove('menu--open');
      const data = await fetchSince(lastSeenTimestamp);
      if (data && data.messages && data.messages.length) {
        const added = mergeIncoming(data.messages);
        if (added > 0) renderChat();
        showToast(added + ' new message' + (added === 1 ? '' : 's'), 'info', 2000);
      } else {
        showToast('No new messages.', 'info', 1800);
      }
    });
    clearHistoryBtn.addEventListener('click', () => {
      menu.classList.remove('menu--open');
      if (!history.length) { showToast('Local cache is already empty.', 'info'); return; }
      if (confirm('Clear the local message cache on this device?\n\n(The Google Sheet archive is untouched. Messages will reload on next fetch.)')) {
        history = [];
        saveHistory();
        saveLastSeen('');
        renderChat();
        showToast('Local cache cleared. Reloading…', 'success');
        setTimeout(() => initialFetch(), 400);
      }
    });

    // =========================================================
    // Init
    // =========================================================
    updateIdentityUI();
    renderChat();
    updateSendButton();
    autoGrow();

    if (!identity) {
      showIdentityModal(false);
    } else {
      initialFetch().then(startPolling);
      setTimeout(() => messageInput.focus(), 200);
    }
  </script>
</body>
</html>
